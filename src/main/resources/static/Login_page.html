<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fitly - Log in</title>
  <link rel="stylesheet" href="Main_page.css" />
</head>
<body>
  <header class="navbar">
    <span class="brand">Fitly</span>
  </header>

  <main class="screen">
    <h1>Log in</h1>
    <p class="subtitle">Welcome back</p>

    <p class="error" id="error" hidden>Wrong email or password.</p>

    <form action="/login" method="post">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button class="primary" type="submit">Log in</button>
    </form>

    <h2>New here?</h2>
    <a class="button" href="Register_page.html">Create an account</a>
  </main>
  <script>
    if (location.search.includes("error=1")) document.getElementById("error").hidden = false;
  </script>
</body>
</html>
