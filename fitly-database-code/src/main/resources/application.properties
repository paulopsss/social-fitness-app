server.port=8080

# ---- Database: H2 (ADR 5) -------------------------------------------
# A file database, so data survives restarts. It is created in ./data/
# the first time the app starts (that folder is in .gitignore).
spring.datasource.url=jdbc:h2:file:./data/fitly;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# ---- Migrations: Flyway ---------------------------------------------
# db/migration holds the schema (V1, V2, ...). db/seed holds the test data.
# For a production deployment, remove classpath:db/seed from this list.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# ---- ORM: Hibernate through Spring Data JPA --------------------------
# Flyway owns the schema. Hibernate only checks that the entity classes
# match the tables, and refuses to start if they do not.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- H2 web console (development only) --------------------------------
# Browse the tables at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/fitly;AUTO_SERVER=TRUE   User: sa   Password: (blank)
spring.h2.console.enabled=true
